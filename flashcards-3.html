<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #B19D8D;
    --bg-soft: #C4B2A2;
    --card-face: #F7F3E8;
    --card-edge: #E8E0CC;
    --ink: #24211B;
    --ink-muted: #6B6558;
    --gold: #FFD8A8;
    --gold-deep: #C2703A;
    --wrong: #B5533C;
    --right: #4C7A5A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(255,255,255,0.03), transparent 40%);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }

  h1 {
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 1.6rem;
    margin: 0 0 4px;
    color: var(--ink);
  }

  .chapter-select {
    background: var(--bg-soft);
    border: 1px solid #5C4C3E;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    padding: 6px 10px;
    border-radius: 6px;
    margin-bottom: 18px;
  }

  .mode-toggle {
    display: flex;
    background: var(--bg-soft);
    border: 1px solid #5C4C3E;
    border-radius: 999px;
    padding: 4px;
    margin-bottom: 28px;
  }

  .mode-btn {
    background: transparent;
    border: none;
    color: var(--ink-muted);
    padding: 8px 20px;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .mode-btn.active {
    background: var(--gold);
    color: #362C24;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    font-size: 0.85rem;
    color: var(--ink-muted);
  }

  .dots { display: flex; gap: 6px; flex-wrap: wrap; max-width: 220px; }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #5C4C3E;
  }

  .dot.active { background: var(--gold-deep); }
  .dot.done { background: #5A6E68; }

  .stage {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .nav-btn {
    background: transparent;
    border: 1px solid #5C4C3E;
    color: var(--ink);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .nav-btn:hover { border-color: var(--gold-deep); background: rgba(194,112,58,0.12); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .nav-btn:disabled:hover { border-color: #5C4C3E; background: transparent; }

  /* Flashcard mode */
  .card-wrap {
    position: relative;
    width: 340px;
    height: 220px;
    perspective: 1400px;
  }

  .star-btn {
    position: absolute;
    top: 10px;
    right: 14px;
    z-index: 5;
    background: transparent;
    border: none;
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    color: var(--gold-deep);
    padding: 4px;
    transition: transform 0.15s ease;
  }

  .star-btn:hover { transform: scale(1.15); }

  .count-badge {
    font-size: 0.75rem;
    opacity: 0.85;
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
  }

  .card.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 10px;
    background: var(--card-face);
    border: 1px solid var(--card-edge);
    box-shadow: 0 18px 30px -14px rgba(0,0,0,0.5);
    padding: 26px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: var(--ink);
    overflow-y: auto;
  }

  .face.back { transform: rotateY(180deg); background: #F1ECDC; }

  .label {
    font-size: 0.7rem;
    color: var(--ink-muted);
    margin-bottom: 10px;
  }

  .prompt-text {
    font-family: 'Lora', serif;
    font-size: 1.15rem;
    line-height: 1.45;
    font-weight: 500;
  }

  .answer-text {
    font-family: 'Lora', serif;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--right);
  }

  .hint {
    text-align: center;
    font-size: 0.78rem;
    color: var(--ink-muted);
    margin-top: 16px;
  }

  .controls-row {
    display: flex;
    gap: 12px;
    margin-top: 26px;
  }

  .pill-btn {
    background: transparent;
    border: 1px solid #5C4C3E;
    color: var(--ink);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.82rem;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .pill-btn:hover { border-color: var(--gold-deep); color: var(--gold-deep); }

  /* Quiz mode */
  .quiz-panel {
    width: 380px;
    background: var(--card-face);
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    box-shadow: 0 18px 30px -14px rgba(0,0,0,0.5);
    padding: 26px;
    color: var(--ink);
  }

  .quiz-question {
    font-family: 'Lora', serif;
    font-size: 1.1rem;
    font-weight: 500;
    line-height: 1.4;
    margin-bottom: 18px;
  }

  .option-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: #FFFDF7;
    border: 1px solid var(--card-edge);
    color: var(--ink);
    padding: 10px 14px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.88rem;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .option-btn:hover:not(:disabled) { border-color: var(--gold); }
  .option-btn:disabled { cursor: default; }

  .option-btn.correct { background: rgba(76,122,90,0.15); border-color: var(--right); color: var(--right); font-weight: 600; }
  .option-btn.incorrect { background: rgba(181,83,60,0.15); border-color: var(--wrong); color: var(--wrong); font-weight: 600; }

  .feedback {
    font-size: 0.85rem;
    font-weight: 600;
    margin: 12px 0 4px;
    min-height: 20px;
  }

  .feedback.correct-text { color: var(--right); }
  .feedback.incorrect-text { color: var(--wrong); }

  .quiz-next {
    margin-top: 14px;
    background: var(--gold);
    border: none;
    color: #362C24;
    padding: 9px 18px;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    display: none;
  }

  .score-panel {
    width: 380px;
    background: var(--card-face);
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    box-shadow: 0 18px 30px -14px rgba(0,0,0,0.5);
    padding: 32px 26px;
    color: var(--ink);
    text-align: center;
  }

  .score-number {
    font-family: 'Lora', serif;
    font-size: 2.2rem;
    font-weight: 600;
    color: var(--gold-deep);
    margin: 6px 0 4px;
  }

  .score-label { color: var(--ink-muted); font-size: 0.85rem; margin-bottom: 20px; }

  @media (max-width: 480px) {
    body { padding: 24px 12px 40px; }

    h1 { font-size: 1.35rem; text-align: center; }

    .chapter-select { max-width: 90vw; }

    .mode-toggle {
      flex-wrap: wrap;
      justify-content: center;
      max-width: 92vw;
      row-gap: 4px;
    }

    .mode-btn { padding: 7px 12px; font-size: 0.78rem; white-space: nowrap; }

    .stage { gap: 6px; width: 100%; justify-content: center; }

    .nav-btn { width: 30px; height: 30px; font-size: 0.9rem; }

    .card-wrap { width: min(68vw, 340px); height: 210px; }

    .prompt-text { font-size: 1.05rem; }

    .answer-text { font-size: 1.05rem; }

    .quiz-panel, .score-panel { width: min(90vw, 380px); padding: 20px; }

    .quiz-question { font-size: 1rem; }

    .option-btn { font-size: 0.85rem; padding: 9px 12px; }

    .star-btn { top: 6px; right: 10px; font-size: 1.25rem; }
  }
</style>
</head>
<body>

  <h1 id="chapterTitle">Chapter 1</h1>
  <select class="chapter-select" id="chapterSelect"></select>

  <div class="mode-toggle">
    <button class="mode-btn active" id="flashModeBtn">Flashcards</button>
    <button class="mode-btn" id="quizModeBtn">Quiz</button>
    <button class="mode-btn" id="stackModeBtn">Study Stack <span class="count-badge" id="stackCount"></span></button>
  </div>

  <!-- Flashcard mode -->
  <div id="flashSection">
    <div class="progress-row">
      <span id="flashProgressLabel"></span>
      <div class="dots" id="flashDots"></div>
    </div>

    <div class="stage">
      <button class="nav-btn" id="flashPrevBtn" aria-label="Previous card">&#8592;</button>

      <div class="card-wrap">
        <button class="star-btn" id="starBtn" aria-label="Add to study stack" title="Add to study stack">&#9734;</button>
        <div class="card" id="card">
          <div class="face front">
            <div class="label">Question</div>
            <div class="prompt-text" id="promptText"></div>
          </div>
          <div class="face back">
            <div class="label">Answer</div>
            <div class="answer-text" id="answerText"></div>
          </div>
        </div>
      </div>

      <button class="nav-btn" id="flashNextBtn" aria-label="Next card">&#8594;</button>
    </div>

    <div class="hint">Tap the card to flip it</div>

    <div class="controls-row">
      <button class="pill-btn" id="shuffleBtn">Shuffle</button>
    </div>
  </div>

  <!-- Quiz mode -->
  <div id="quizSection" style="display:none;">
    <div class="progress-row">
      <span id="quizProgressLabel"></span>
      <div class="dots" id="quizDots"></div>
    </div>

    <div class="quiz-panel" id="quizPanel">
      <div class="quiz-question" id="quizQuestion"></div>
      <div id="quizOptions"></div>
      <div class="feedback" id="quizFeedback"></div>
      <button class="quiz-next" id="quizNextBtn">Next question</button>
    </div>

    <div class="score-panel" id="scorePanel" style="display:none;">
      <div class="score-label">Quiz complete</div>
      <div class="score-number" id="scoreNumber"></div>
      <div class="score-label" id="scoreDetail"></div>
      <button class="pill-btn" id="retakeBtn">Retake quiz</button>
    </div>
  </div>

  <!-- Study Stack mode -->
  <div id="stackSection" style="display:none;">
    <div class="progress-row" id="stackProgressRow">
      <span id="stackProgressLabel"></span>
      <div class="dots" id="stackDots"></div>
    </div>

    <div class="stage" id="stackStage">
      <button class="nav-btn" id="stackPrevBtn" aria-label="Previous card">&#8592;</button>

      <div class="card-wrap">
        <button class="star-btn" id="stackStarBtn" aria-label="Remove from study stack" title="Remove from study stack">&#9733;</button>
        <div class="card" id="stackCard">
          <div class="face front">
            <div class="label" id="stackChapterLabel">Chapter</div>
            <div class="prompt-text" id="stackPromptText"></div>
          </div>
          <div class="face back">
            <div class="label">Answer</div>
            <div class="answer-text" id="stackAnswerText"></div>
          </div>
        </div>
      </div>

      <button class="nav-btn" id="stackNextBtn" aria-label="Next card">&#8594;</button>
    </div>

    <div class="hint" id="stackHint">Tap the card to flip it</div>

    <div class="controls-row">
      <button class="pill-btn" id="clearStackBtn">Clear stack</button>
    </div>

    <div class="score-panel" id="stackEmptyPanel" style="display:none;">
      <div class="score-label">Your study stack is empty</div>
      <div class="score-label" style="margin-bottom:0;">Star any flashcard to add it here.</div>
    </div>
  </div>

        options: ["Forms from partial melting of mantle peridotite, common at mid-ocean ridges and hot spots", "Forms from partial melting of continental crust", "Forms at subduction zones where water lowers the mantle wedge's melting point", "Forms only from crystal settling in a magma chamber"], correct: 0 },

        options: ["Commonly forms at subduction zones, where water from the subducting plate lowers the melting point of the mantle wedge above it", "Forms from partial melting of mantle peridotite at mid-ocean ridges", "Forms from partial melting of continental crust", "Forms only through magmatic differentiation"], correct: 0 },
      { q: "Granitic (felsic) magma:",
        options: ["Forms from partial melting of continental crust", "Forms from partial melting of mantle peridotite", "Forms at subduction zones from mantle wedge melting", "Forms only through crystal settling"], correct: 0 }

  };

  // Assign a stable id to every card so it can be starred regardless of chapter or shuffle order
  Object.keys(deck).forEach(chapterName => {
    deck[chapterName].forEach((card, i) => {
      card.id = chapterName + '::' + i;
      card.chapter = chapterName;
    });
  });

  let starredIds = new Set();

  function saveStarredIds() {
    try {
      localStorage.setItem('geoFlashcards_starredIds', JSON.stringify([...starredIds]));
    } catch (e) { /* storage unavailable, fail silently */ }
  }

  function loadStarredIds() {
    try {
      const raw = localStorage.getItem('geoFlashcards_starredIds');
      if (raw) starredIds = new Set(JSON.parse(raw));
    } catch (e) { /* storage unavailable, fail silently */ }
  }

  loadStarredIds();

  let currentChapter = Object.keys(deck)[0];
  let mode = 'flash';

  // Flashcard state
  let flashCards = [...deck[currentChapter]];
  let flashIndex = 0;
  let flashFlipped = false;

  // Quiz state
  let quizCards = [...deck[currentChapter]];
  let quizIndex = 0;
  let quizScore = 0;
  let quizAnswered = false;

  const chapterSelect = document.getElementById('chapterSelect');
  const chapterTitle = document.getElementById('chapterTitle');
  const flashModeBtn = document.getElementById('flashModeBtn');
  const quizModeBtn = document.getElementById('quizModeBtn');
  const stackModeBtn = document.getElementById('stackModeBtn');
  const flashSection = document.getElementById('flashSection');
  const quizSection = document.getElementById('quizSection');
  const stackSection = document.getElementById('stackSection');

  function populateChapterSelect() {
    chapterSelect.innerHTML = '';
    Object.keys(deck).forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      chapterSelect.appendChild(opt);
    });
    chapterSelect.value = currentChapter;
  }

  chapterSelect.addEventListener('change', () => {
    currentChapter = chapterSelect.value;
    chapterTitle.textContent = currentChapter;
    resetFlash();
    resetQuiz();
  });

  // ---- Mode switching ----
  flashModeBtn.addEventListener('click', () => setMode('flash'));
  quizModeBtn.addEventListener('click', () => setMode('quiz'));
  stackModeBtn.addEventListener('click', () => setMode('stack'));

  function setMode(m) {
    mode = m;
    flashModeBtn.classList.toggle('active', m === 'flash');
    quizModeBtn.classList.toggle('active', m === 'quiz');
    stackModeBtn.classList.toggle('active', m === 'stack');
    flashSection.style.display = m === 'flash' ? 'block' : 'none';
    quizSection.style.display = m === 'quiz' ? 'block' : 'none';
    stackSection.style.display = m === 'stack' ? 'block' : 'none';
    if (m === 'stack') renderStack();
  }

  // ---- Flashcard mode ----
  const cardEl = document.getElementById('card');
  const promptText = document.getElementById('promptText');
  const answerText = document.getElementById('answerText');
  const flashProgressLabel = document.getElementById('flashProgressLabel');
  const flashDots = document.getElementById('flashDots');
  const flashPrevBtn = document.getElementById('flashPrevBtn');
  const flashNextBtn = document.getElementById('flashNextBtn');
  const starBtn = document.getElementById('starBtn');

  function toggleStar(id) {
    if (starredIds.has(id)) starredIds.delete(id);
    else starredIds.add(id);
    saveStarredIds();
    updateStackCount();
  }

  function updateStackCount() {
    const n = starredIds.size;
    document.getElementById('stackCount').textContent = n > 0 ? `(${n})` : '';
  }

  starBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleStar(flashCards[flashIndex].id);
    updateStarButton();
  });

  function updateStarButton() {
    const starred = starredIds.has(flashCards[flashIndex].id);
    starBtn.innerHTML = starred ? '&#9733;' : '&#9734;';
  }

  function renderFlashDots() {
    flashDots.innerHTML = '';
    flashCards.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === flashIndex ? ' active' : i < flashIndex ? ' done' : '');
      flashDots.appendChild(d);
    });
  }

  function renderFlash() {
    const c = flashCards[flashIndex];
    promptText.textContent = c.q;
    answerText.textContent = c.options[c.correct];
    flashProgressLabel.textContent = `Card ${flashIndex + 1} of ${flashCards.length}`;
    flashPrevBtn.disabled = flashIndex === 0;
    flashNextBtn.disabled = flashIndex === flashCards.length - 1;
    renderFlashDots();
    updateStarButton();
  }

  function setFlashFlipped(state) {
    flashFlipped = state;
    cardEl.classList.toggle('flipped', flashFlipped);
  }

  cardEl.addEventListener('click', () => setFlashFlipped(!flashFlipped));

  flashPrevBtn.addEventListener('click', () => {
    if (flashIndex > 0) { flashIndex--; setFlashFlipped(false); renderFlash(); }
  });

  flashNextBtn.addEventListener('click', () => {
    if (flashIndex < flashCards.length - 1) { flashIndex++; setFlashFlipped(false); renderFlash(); }
  });

  document.getElementById('shuffleBtn').addEventListener('click', () => {
    shuffleArray(flashCards);
    flashIndex = 0;
    setFlashFlipped(false);
    renderFlash();
  });

  function resetFlash() {
    flashCards = [...deck[currentChapter]];
    flashIndex = 0;
    setFlashFlipped(false);
    renderFlash();
  }

  // ---- Quiz mode ----
  const quizQuestion = document.getElementById('quizQuestion');
  const quizOptions = document.getElementById('quizOptions');
  const quizFeedback = document.getElementById('quizFeedback');
  const quizNextBtn = document.getElementById('quizNextBtn');
  const quizProgressLabel = document.getElementById('quizProgressLabel');
  const quizDots = document.getElementById('quizDots');
  const quizPanel = document.getElementById('quizPanel');
  const scorePanel = document.getElementById('scorePanel');
  const scoreNumber = document.getElementById('scoreNumber');
  const scoreDetail = document.getElementById('scoreDetail');
  const retakeBtn = document.getElementById('retakeBtn');

  function renderQuizDots() {
    quizDots.innerHTML = '';
    quizCards.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === quizIndex ? ' active' : i < quizIndex ? ' done' : '');
      quizDots.appendChild(d);
    });
  }

  function renderQuizQuestion() {
    quizAnswered = false;
    const c = quizCards[quizIndex];
    quizQuestion.textContent = c.q;
    quizOptions.innerHTML = '';
    quizFeedback.textContent = '';
    quizFeedback.className = 'feedback';
    quizNextBtn.style.display = 'none';
    quizProgressLabel.textContent = `Question ${quizIndex + 1} of ${quizCards.length}  ·  Score: ${quizScore}`;

    c.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt;
      btn.addEventListener('click', () => selectOption(i));
      quizOptions.appendChild(btn);
    });

    renderQuizDots();
  }

  function selectOption(selectedIndex) {
    if (quizAnswered) return;
    quizAnswered = true;
    const c = quizCards[quizIndex];
    const buttons = quizOptions.querySelectorAll('.option-btn');
    buttons.forEach((btn, i) => {
      btn.disabled = true;
      if (i === c.correct) btn.classList.add('correct');
      if (i === selectedIndex && selectedIndex !== c.correct) btn.classList.add('incorrect');
    });

    if (selectedIndex === c.correct) {
      quizScore++;
      quizFeedback.textContent = 'Correct.';
      quizFeedback.classList.add('correct-text');
    } else {
      quizFeedback.textContent = `Not quite. The correct answer is: ${c.options[c.correct]}`;
      quizFeedback.classList.add('incorrect-text');
    }

    quizProgressLabel.textContent = `Question ${quizIndex + 1} of ${quizCards.length}  ·  Score: ${quizScore}`;
    quizNextBtn.style.display = 'inline-block';
    quizNextBtn.textContent = quizIndex === quizCards.length - 1 ? 'See results' : 'Next question';
  }

  quizNextBtn.addEventListener('click', () => {
    if (quizIndex < quizCards.length - 1) {
      quizIndex++;
      renderQuizQuestion();
    } else {
      showScore();
    }
  });

  function showScore() {
    quizPanel.style.display = 'none';
    scorePanel.style.display = 'block';
    scoreNumber.textContent = `${quizScore} / ${quizCards.length}`;
    scoreDetail.textContent = `${Math.round((quizScore / quizCards.length) * 100)}% correct`;
    quizProgressLabel.textContent = '';
    quizDots.innerHTML = '';
  }

  retakeBtn.addEventListener('click', () => {
    resetQuiz();
  });

  function resetQuiz() {
    quizCards = [...deck[currentChapter]];
    quizIndex = 0;
    quizScore = 0;
    quizPanel.style.display = 'block';
    scorePanel.style.display = 'none';
    renderQuizQuestion();
  }

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  // ---- Study Stack mode ----
  let stackCards = [];
  let stackIndex = 0;
  let stackFlipped = false;

  const stackCardEl = document.getElementById('stackCard');
  const stackPromptText = document.getElementById('stackPromptText');
  const stackAnswerText = document.getElementById('stackAnswerText');
  const stackChapterLabel = document.getElementById('stackChapterLabel');
  const stackProgressLabel = document.getElementById('stackProgressLabel');
  const stackProgressRow = document.getElementById('stackProgressRow');
  const stackDots = document.getElementById('stackDots');
  const stackPrevBtn = document.getElementById('stackPrevBtn');
  const stackNextBtn = document.getElementById('stackNextBtn');
  const stackStarBtn = document.getElementById('stackStarBtn');
  const stackStage = document.getElementById('stackStage');
  const stackHint = document.getElementById('stackHint');
  const stackEmptyPanel = document.getElementById('stackEmptyPanel');
  const clearStackBtn = document.getElementById('clearStackBtn');

  function getAllCards() {
    let all = [];
    Object.keys(deck).forEach(chapterName => { all = all.concat(deck[chapterName]); });
    return all;
  }

  function renderStack() {
    stackCards = getAllCards().filter(c => starredIds.has(c.id));
    if (stackIndex >= stackCards.length) stackIndex = Math.max(0, stackCards.length - 1);
    stackFlipped = false;
    stackCardEl.classList.remove('flipped');

    if (stackCards.length === 0) {
      stackStage.style.display = 'none';
      stackHint.style.display = 'none';
      stackProgressRow.style.display = 'none';
      clearStackBtn.style.display = 'none';
      stackEmptyPanel.style.display = 'block';
      return;
    }

    stackStage.style.display = 'flex';
    stackHint.style.display = 'block';
    stackProgressRow.style.display = 'flex';
    clearStackBtn.style.display = 'inline-block';
    stackEmptyPanel.style.display = 'none';

    renderStackCard();
  }

  function renderStackCard() {
    const c = stackCards[stackIndex];
    stackChapterLabel.textContent = c.chapter;
    stackPromptText.textContent = c.q;
    stackAnswerText.textContent = c.options[c.correct];
    stackProgressLabel.textContent = `Card ${stackIndex + 1} of ${stackCards.length}`;
    stackPrevBtn.disabled = stackIndex === 0;
    stackNextBtn.disabled = stackIndex === stackCards.length - 1;
    stackStarBtn.innerHTML = '&#9733;';

    stackDots.innerHTML = '';
    stackCards.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === stackIndex ? ' active' : i < stackIndex ? ' done' : '');
      stackDots.appendChild(d);
    });
  }

  stackCardEl.addEventListener('click', () => {
    stackFlipped = !stackFlipped;
    stackCardEl.classList.toggle('flipped', stackFlipped);
  });

  stackPrevBtn.addEventListener('click', () => {
    if (stackIndex > 0) {
      stackIndex--;
      stackFlipped = false;
      stackCardEl.classList.remove('flipped');
      renderStackCard();
    }
  });

  stackNextBtn.addEventListener('click', () => {
    if (stackIndex < stackCards.length - 1) {
      stackIndex++;
      stackFlipped = false;
      stackCardEl.classList.remove('flipped');
      renderStackCard();
    }
  });

  stackStarBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const c = stackCards[stackIndex];
    toggleStar(c.id);
    renderStack();
  });

  clearStackBtn.addEventListener('click', () => {
    starredIds.clear();
    saveStarredIds();
    updateStackCount();
    renderStack();
  });

  document.addEventListener('keydown', (e) => {
    if (mode === 'flash') {
      if (e.key === 'ArrowRight') flashNextBtn.click();
      if (e.key === 'ArrowLeft') flashPrevBtn.click();
      if (e.key === ' ') { e.preventDefault(); setFlashFlipped(!flashFlipped); }
    } else if (mode === 'stack') {
      if (e.key === 'ArrowRight') stackNextBtn.click();
      if (e.key === 'ArrowLeft') stackPrevBtn.click();
      if (e.key === ' ') { e.preventDefault(); stackCardEl.click(); }
    }
  });

  // ---- Init ----
  populateChapterSelect();
  renderFlash();
  renderQuizQuestion();
  updateStackCount();
</script>

</body>
</html>
